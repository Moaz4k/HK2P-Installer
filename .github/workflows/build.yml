name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          unzip -q "$(ls *.zip | head -n1)" -d src
          echo "PROJECT_DIR=$(dirname "$(find src -name settings.gradle | head -n1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Build
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: HK2P-Mod-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
